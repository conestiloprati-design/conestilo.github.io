<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin Categorías</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/categorias.js"></script>
</head>
<body>

<nav>
  <a href="index.html">Inicio</a>
  <a href="admin-productos.html">Admin Productos</a>
  <a href="admin-categorias.html">Admin Categorías</a>
  <a href="admin-descuentos.html">Admin Descuentos</a>
</nav>
<hr>


  <h1>Administrar Categorías</h1>

  <form onsubmit="agregarCategoria(document.getElementById('nuevaCat').value); return false;">
    <input id="nuevaCat" placeholder="Nueva categoría">
    <button type="submit">Agregar</button>
  </form>

  <div id="categorias"></div>

  <script type="module">
    import { cargarCategorias, eliminarCategoria } from './js/categorias.js'

    async function render() {
      const categorias = await cargarCategorias()
      const cont = document.getElementById('categorias')
      cont.innerHTML = ''
      categorias.forEach((c, i) => {
        cont.innerHTML += `<div>${c} <button onclick="eliminarCategoria(${i})">Eliminar</button></div>`
      })
    }
    render()
  </script>
</body>
</html>
