<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoría</title>
  
<link rel="icon" href="https://i.postimg.cc/Gp6QRtKG/IMG-20260520-174004.png">
<link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="index.html#categorias">Categorías</a>
    <a href="index.html#productos">Descuentos</a>
    
  </nav>
</header>

<section class="productos">
  <h2 id="tituloCategoria">Productos</h2>

  <div id="productosGrid" class="productos-grid"></div>
</section>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// ================= SUPABASE =================
const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)


// ================= WHATSAPP =================
window.comprar = function(nombre, precio, imagen) {

  const telefono = "5358231944"

  const mensaje = `🛍️ Hola, quiero comprar:%0A
Producto: ${nombre}%0A
Precio: $${precio}%0A
Imagen: ${imagen}`

  const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`

  window.open(url, "_blank")
}


// ================= OBTENER ID =================
const params = new URLSearchParams(window.location.search)
const categoriaId = params.get('id')

// ================= FUNCION PARA PROCESAR DESCRIPCIÓN =================
function procesarDescripcion(texto) {
  if (!texto) return "";

  const colores = {
    "rojo": "red",
    "azul": "blue",
    "verde": "green",
    "amarillo": "yellow",
    "negro": "black",
    "blanco": "white",
    "gris": "gray",
    "naranja": "orange",
    "violeta": "purple",
    "marrón": "brown"
  };

  let resultado = texto;

  Object.keys(colores).forEach(nombre => {
    const regex = new RegExp(nombre, "gi");
    resultado = resultado.replace(
      regex,
      `<span class="color-circulo" style="background-color:${colores[nombre]};"></span>`
    );
  });

  return `<p class="descripcion">${resultado}</p>`;
}
  
// ================= CARGAR PRODUCTOS =================
async function cargarProductos() {

  // 🔹 productos de la categoría
  const { data: productos } = await supabase
    .from('productos')
    .select('*')
    .eq('categoria_id', categoriaId)

  // 🔹 descuentos
  const { data: descuentos } = await supabase
    .from('descuentos')
    .select('producto_id')

  // 🔹 estados
  const { data: estados } = await supabase
    .from('estados')
    .select('*')

  // 🔹 categorías (para título)
  const { data: categorias } = await supabase
    .from('categorias')
    .select('*')

  // 🔥 título dinámico
  const cat = categorias.find(c => c.id == categoriaId)
  if (cat) {
    document.getElementById('tituloCategoria').innerText = cat.nombre
  }

  // 🚫 excluir productos en descuento
  const idsEnDescuento = descuentos.map(d => d.producto_id)

  const filtrados = productos.filter(p =>
    !idsEnDescuento.includes(p.id)
  )

  const cont = document.getElementById('productosGrid')
  cont.innerHTML = ''

  filtrados.forEach(p => {

    const e = estados.find(x => x.producto_id == p.id)
    const estado = e ? e.estado : "disponible"

    const estadoTexto = estado === "agotado"
      ? "<span class='agotado'>❌ Agotado</span>"
      : "<span class='disponible'>✔ Disponible</span>"

    const boton = estado === "agotado"
      ? `<button disabled>Agotado</button>`
      : `<button onclick="comprar('${p.nombre}','${p.precio}','${p.imagen}')">Comprar</button>`

    // procesar descripción
    const descripcionHTML = p.descripcion ? procesarDescripcion(p.descripcion) : ''
    
    cont.innerHTML += `
      <div class="producto-card">

        <img src="${p.imagen}">

        <h3>${p.nombre}</h3>

        ${p.talla ? `<p>👕 Talla: ${p.talla}</p>` : ""}
        ${p.numero ? `<p>👟 Número: ${p.numero}</p>` : ""}
         ${p.descripcion ? `📝 ${p.descripcion}<br>` : ""}
        <p>
          <span class="precio-nuevo">$${p.precio} ${p.moneda}</span>
        </p>

        ${estadoTexto}

        ${boton}

      </div>
    `
  })
}


// ================= INIT =================
cargarProductos()

</script>

</body>
</html>
