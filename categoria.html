<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoría</title>
  
<link rel="icon" href="https://i.postimg.cc/Gp6QRtKG/IMG-20260520-174004.png">
<link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="index.html#categorias">Categorías</a>
    <a href="index.html#productos">Descuentos</a>
    
  </nav>
</header>

<!-- Mensaje temporal -->
<div id="mensaje" style="display: none;">
  <p>¡Bienvenido a Co'n Estilo! Todo está disponible en casa.</p>
</div>  

<section class="productos">
  <h2 id="tituloCategoria">Productos</h2>

  <div id="productosGrid" class="productos-grid"></div>
</section>
  <!-- Visor de imágenes -->
<div id="visorImagen" class="visor-imagen">
    <span id="cerrarImagen">&times;</span>
    <img id="imagenGrande">
</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// ================= SUPABASE =================
const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)


// ================= WHATSAPP =================
window.comprar = function(nombre, precio, imagen, talla, numero) {

  const telefono = "5358231944";

  let mensaje = `🛍️ Hola, quiero comprar:
━━━━━━━━━━━━━━━

👕 Producto: ${nombre}
💰 Precio: $${precio}`;

  // 👕 talla opcional
  if (talla) {
    mensaje += `\n👕 Talla: ${talla}`;
  }

  // 👟 número opcional
  if (numero) {
    mensaje += `\n👟 Número: ${numero}`;
  }

  // 🖼️ imagen siempre al final
  if (imagen) {
    mensaje += `\n\n🖼️ Imagen del producto:\n${imagen}`;
  }

  mensaje += `\n━━━━━━━━━━━━━━━`;

  const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;

  window.open(url, "_blank");
}


// ================= OBTENER ID =================
const params = new URLSearchParams(window.location.search)
const categoriaId = params.get('id')

// ================= FUNCION PARA PROCESAR DESCRIPCIÓN =================
function procesarDescripcion(texto) {
  if (!texto) return "";

  const colores = {
    "rojo": "red",
    "azul": "blue",
    "verde": "green",
    "amarillo": "yellow",
    "negro": "black",
    "blanco": "white",
    "gris": "gray",
    "naranja": "orange",
    "violeta": "purple",
    "marrón": "brown",
    "carmelita": "#A86A4A"
  };

  let resultado = texto;

  Object.keys(colores).forEach(nombre => {
    const regex = new RegExp(nombre, "gi");
    resultado = resultado.replace(
      regex,
      `<span class="color-circulo" style="background-color:${colores[nombre]};"></span>`
    );
  });

  return `<p class="descripcion">📝 ${resultado}</p>`;
}
  
// ================= CARGAR PRODUCTOS =================
async function cargarProductos() {

  // 🔹 productos de la categoría
  const { data: productos } = await supabase
    .from('productos')
    .select('*')
    .eq('categoria_id', categoriaId)

  // 🔹 descuentos
  const { data: descuentos } = await supabase
    .from('descuentos')
    .select('producto_id')

  // 🔹 estados
  const { data: estados } = await supabase
    .from('estados')
    .select('*')

  // 🔹 categorías (para título)
  const { data: categorias } = await supabase
    .from('categorias')
    .select('*')

  // 🔥 título dinámico
  const cat = categorias.find(c => c.id == categoriaId)
  if (cat) {
    document.getElementById('tituloCategoria').innerText = cat.nombre
  }

  // 🚫 excluir productos en descuento
  const idsEnDescuento = descuentos.map(d => d.producto_id)

  const filtrados = productos.filter(p =>
    !idsEnDescuento.includes(p.id)
  )

  const cont = document.getElementById('productosGrid')
  cont.innerHTML = ''

  filtrados.forEach(p => {

    const e = estados.find(x => x.producto_id == p.id)
    const estado = e ? e.estado : "disponible"

    const estadoTexto = estado === "agotado"
      ? "<span class='agotado'>❌ Agotado</span>"
      : "<span class='disponible'>✔ Disponible</span>"

    const boton = estado === "agotado"
      ? `<button disabled>Agotado</button>`
      : `<button onclick="comprar('${p.nombre}','${p.precio}','${p.imagen}','${p.talla || ""}','${p.numero || ""}')">Comprar</button>`

    // procesar descripción
    const descripcionHTML = p.descripcion ? procesarDescripcion(p.descripcion) : ''
    
    cont.innerHTML += `
      <div class="producto-card">

        <img src="${p.imagen}" onclick="abrirImagen('${p.imagen}')" style="cursor:zoom-in;">

        <h3>${p.nombre}</h3>

        ${p.talla ? `<p>👕 Talla: ${p.talla}</p>` : ""}
        ${p.numero ? `<p>👟 Número: ${p.numero}</p>` : ""}
        ${p.descripcion ? procesarDescripcion(p.descripcion) : ""}
        <p>
          <span class="precio-nuevo">$${p.precio} ${p.moneda}</span>
        </p>

        ${estadoTexto}

        ${boton}

      </div>
    `
  })
}


// ================= INIT =================
cargarProductos()

</script>

<script>
const visor = document.getElementById("visorImagen");
const imagenGrande = document.getElementById("imagenGrande");
const cerrar = document.getElementById("cerrarImagen");

let visorAbierto = false;

window.abrirImagen = function(src){
    imagenGrande.src = src;
    visor.style.display = "flex";
    document.body.style.overflow = "hidden";

    visorAbierto = true;

    history.pushState({visor:true}, "");
}

function cerrarImagen(){
    visor.style.display = "none";
    document.body.style.overflow = "";
    visorAbierto = false;
}

cerrar.onclick = () => history.back();

visor.onclick = function(e){
    if(e.target === visor){
        history.back();
    }
}

window.addEventListener("popstate", function(){
    if(visorAbierto){
        cerrarImagen();
    }
});
</script>
  
  <script>
  window.onload = function() {
    // Mostrar el mensaje
    const mensaje = document.getElementById("mensaje");
    mensaje.style.display = "block"; // Hacer visible el mensaje

    // Ocultar el mensaje después de 5 segundos (5000 milisegundos)
    setTimeout(function() {
      mensaje.style.display = "none"; // Ocultar el mensaje
    }, 5000);
  };
</script>

</body>
</html>
