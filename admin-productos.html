<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin Productos</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/productos.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="admin-productos.html">Admin Productos</a>
    <a href="admin-categorias.html">Admin Categorías</a>
    <a href="admin-descuentos.html">Admin Descuentos</a>
  </nav>
  <hr>

  <h1>Administrar Productos</h1>

  <form id="formProducto">
    <input id="nombre" placeholder="Nombre" required>
    <input id="precio" type="number" placeholder="Precio" required>
    <input id="imagen" placeholder="URL Imagen" required>
    <input id="categoria" placeholder="Categoría" required>
    <button type="submit">Agregar Producto</button>
  </form>

  <div id="productos"></div>

  <script type="module">
    import { cargarProductos, agregarProducto, eliminarProducto, actualizarEstado } from './js/productos.js'

    // Manejar el formulario
    document.getElementById('formProducto').addEventListener('submit', async (e) => {
      e.preventDefault()
      const nombre = document.getElementById('nombre').value
      const precio = parseFloat(document.getElementById('precio').value) || 0
      const imagen = document.getElementById('imagen').value
      const categoria = document.getElementById('categoria').value

      await agregarProducto({ nombre, precio, imagen, categoria })
      render()
    })

    // Renderizar lista de productos con botones dinámicos
    async function render() {
      const productos = await cargarProductos()
      const cont = document.getElementById('productos')
      cont.innerHTML = ''

      productos.forEach(p => {
        const div = document.createElement('div')
        div.innerHTML = `
          <h3>${p.nombre}</h3>
          <p>$${p.precio}</p>
        `

        const btnEliminar = document.createElement('button')
        btnEliminar.textContent = 'Eliminar'
        btnEliminar.addEventListener('click', async () => {
          await eliminarProducto(p.id)
          render()
        })

        const btnDisponible = document.createElement('button')
        btnDisponible.textContent = 'Disponible'
        btnDisponible.addEventListener('click', async () => {
          await actualizarEstado(p.id, true)
          render()
        })

        const btnAgotado = document.createElement('button')
        btnAgotado.textContent = 'Agotado'
        btnAgotado.addEventListener('click', async () => {
          await actualizarEstado(p.id, false)
          render()
        })

        div.appendChild(btnEliminar)
        div.appendChild(btnDisponible)
        div.appendChild(btnAgotado)
        cont.appendChild(div)
      })
    }

    render()
  </script>
</body>
</html>
