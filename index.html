<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Co'n Estilo</title>
<link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>
</header>

<!-- 🏷️ CATEGORÍAS -->
<section class="categorias">
  <h2>Categorías</h2>
  <div class="categoria-grid" id="categorias"></div>
</section>

<!-- 🔥 DESCUENTOS -->
<section class="productos">
  <h2>🔥 Ofertas</h2>
  <div class="productos-grid" id="descuentos"></div>
</section>

<!-- 🛍️ PRODUCTOS -->
<section class="productos">
  <h2 id="titulo">Productos</h2>
  <div class="productos-grid" id="productos"></div>
</section>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)

let TODOS = []

// 🛍️ PRODUCTOS
function render(lista, contenedor) {
  const cont = document.getElementById(contenedor)
  cont.innerHTML = ''

  lista.forEach(p => {
    cont.innerHTML += `
      <div class="producto-card">
        <img src="${p.imagen}">
        <h3>${p.nombre}</h3>

        ${
          p.descuento
          ? `<p>
              <span class="precio-viejo">$${p.precio}</span>
              <span class="precio-nuevo">$${p.precio_desc}</span>
            </p>`
          : `<p>$${p.precio}</p>`
        }

        <button onclick="comprar('${p.nombre}')">
          Comprar
        </button>
      </div>
    `
  })
}

// 🟢 WHATSAPP
window.comprar = function(nombre) {
  const numero = '5354555815' // 🔴 TU NÚMERO
  const mensaje = `Hola, quiero comprar: ${nombre}`
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`)
}

// 🔥 FILTRAR
window.filtrar = function(cat) {
  const filtrados = TODOS.filter(p => p.categoria === cat)
  document.getElementById('titulo').innerText = cat
  render(filtrados, 'productos')
}

// 🏷️ CATEGORÍAS
function renderCategorias(lista) {
  const cont = document.getElementById('categorias')
  cont.innerHTML = ''

  lista.forEach(c => {
    cont.innerHTML += `
      <div class="categoria-card" onclick="filtrar('${c}')">
        <img src="https://picsum.photos/400/500?random=${c}">
        <h3>${c}</h3>
      </div>
    `
  })
}

// 🚀 INIT
async function init() {

  const { data } = await supabase.from('productos').select('*')

  TODOS = data

  const categorias = [...new Set(data.map(p => p.categoria))]
  const descuentos = data.filter(p => p.descuento === true)

  renderCategorias(categorias)
  render(descuentos, 'descuentos')

  if (categorias.length > 0) {
    filtrar(categorias[0])
  }
}

init()

</script>

</body>
</html>
