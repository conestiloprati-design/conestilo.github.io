<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Tienda</title>

  <link rel="stylesheet" href="css/estilos.css">

  <script type="module" src="js/productos.js"></script>
  <script type="module" src="js/categorias.js"></script>
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Productos</a>
    <a href="#">Contacto</a>
  </nav>
</header>

<!-- 🔥 HERO -->
<section class="hero">
  <div class="overlay">
    <h1>Descubre tu estilo</h1>
    <p>Moda moderna al mejor precio</p>
    <a href="#categorias" class="btn">Comprar ahora</a>
  </div>
</section>

<!-- 🏷️ CATEGORÍAS CON IMAGEN -->
<section class="categorias" id="categorias">
  <h2>Categorías</h2>
  <div class="categoria-grid" id="lista-categorias"></div>
</section>

<!-- 🛍️ PRODUCTOS -->
<section class="productos">
  <h2 id="titulo-categoria">Productos</h2>
  <div class="productos-grid" id="lista-productos"></div>
</section>

<footer>
  <h3>Co'n Estilo</h3>
  <p>Síguenos en redes</p>
</footer>

<script type="module">
  import { cargarProductos } from './js/productos.js'
  import { cargarCategorias } from './js/categorias.js'

  let TODOS = []

  // 🛍️ MOSTRAR PRODUCTOS
  function renderProductos(lista) {
    const cont = document.getElementById('lista-productos')
    cont.innerHTML = ''

    lista.forEach(p => {
      cont.innerHTML += `
        <div class="producto-card">
          <img src="${p.imagen}">
          <h3>${p.nombre}</h3>
          <p class="${p.precio == 0 ? 'agotado' : ''}">
            ${p.precio == 0 ? 'Agotado' : '$' + p.precio}
          </p>
          <button ${p.precio == 0 ? 'disabled' : ''}>
            Comprar
          </button>
        </div>
      `
    })
  }

  // 🔥 FILTRAR POR CATEGORÍA
  window.filtrarCategoria = function(cat) {
    const filtrados = TODOS.filter(p => p.categoria === cat)

    document.getElementById('titulo-categoria').innerText = cat

    renderProductos(filtrados)
  }

  // 🏷️ MOSTRAR CATEGORÍAS CON IMAGEN
  function renderCategorias(lista) {
    const cont = document.getElementById('lista-categorias')
    cont.innerHTML = ''

    lista.forEach(c => {
      cont.innerHTML += `
        <div class="categoria-card" onclick="filtrarCategoria('${c.nombre}')">
          <img src="${c.imagen}">
          <h3>${c.nombre}</h3>
        </div>
      `
    })
  }

  async function init() {
    TODOS = await cargarProductos()
    const categorias = await cargarCategorias()

    renderCategorias(categorias)

    // 🔥 mostrar primera categoría automáticamente
    if (categorias.length > 0) {
      filtrarCategoria(categorias[0].nombre)
    }
  }

  init()
</script>

</body>
</html>
