<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co'n Estilo</title>
    <link rel="icon" href="https://i.postimg.cc/Gp6QRtKG/IMG-20260520-174004.png">
    <link rel="stylesheet" href="css/estilos.css">
    
</head>
    
<body>

<header>
    <div class="logo">Co'n Estilo</div>

    <nav>
       <script type="module" src="js/productos.js"></script>
       <script type="module" src="js/categorias.js"></script>
       <script type="module" src="js/descuentos.js"></script>
    </nav>
</header>

<section class="hero">
    <div class="overlay">
        <h1>Moda con estilo</h1>
        <p>Zapatos, ropa y accesorios modernos
                Todo disponible en casa</p>
        <a href="#productos" class="btn">Ver productos</a>
    </div>
</section>

<section>
  <h2>🔥 Ofertas</h2>
  <div id="lista-descuentos"></div>
</section>

<section>
  <h2>🛒 Categorías</h2>
  <div id="categorias"></div>
</section>

<section>
  <h2>Productos</h2>
  <div id="productos"></div>
</section>

<script type="module">
  import { cargarProductos } from './js/productos.js'
  import { cargarCategorias } from './js/categorias.js'
  import { cargarDescuentos } from './js/descuentos.js'

  let TODOS = []

  function renderProductos(lista) {
    const cont = document.getElementById('productos')
    cont.innerHTML = ''

    lista.forEach(p => {
      cont.innerHTML += `
        <div class="producto">
          <img src="${p.imagen}">
          <div class="info">
            <h4>${p.nombre}</h4>
            <p class="${p.precio == 0 ? 'agotado' : 'precio'}">
              ${p.precio == 0 ? 'Agotado' : '$' + p.precio}
            </p>
          </div>
        </div>
      `
    })
  }

  // 🔥 FILTRAR POR CATEGORÍA
  window.filtrar = function(cat, btn) {

    // quitar activo
    document.querySelectorAll('#categorias button')
      .forEach(b => b.classList.remove('activo'))

    btn.classList.add('activo')

    if (cat === 'Todos') {
      renderProductos(TODOS)
    } else {
      const filtrados = TODOS.filter(p => p.categoria === cat)
      renderProductos(filtrados)
    }
  }

  async function init() {

    TODOS = await cargarProductos()
    const categorias = await cargarCategorias()
    const descuentos = await cargarDescuentos()

    // 🛍️ Productos inicial
    renderProductos(TODOS)

    // 🏷️ Categorías
    const contCat = document.getElementById('categorias')

    contCat.innerHTML += `
      <button class="activo" onclick="filtrar('Todos', this)">Todos</button>
    `

    categorias.forEach(c => {
      contCat.innerHTML += `
        <button onclick="filtrar('${c}', this)">${c}</button>
      `
    })

    // 💥 Descuentos
    const contDesc = document.getElementById('lista-descuentos')

    descuentos.forEach(d => {
      contDesc.innerHTML += `
        <div class="descuento">
          <h4>${d.nombre}</h4>
          <p>$${d.precio}</p>
        </div>
      `
    })
  }

  init()
</script>

</body>
</html>
