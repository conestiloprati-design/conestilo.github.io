<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Tienda</title>

  <!-- TU CSS -->
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>
</header>

<!-- 🏷️ CATEGORÍAS -->
<section class="categorias">
  <h2>Categorías</h2>
  <div class="categoria-grid" id="categorias"></div>
</section>

<!-- 🛍️ PRODUCTOS -->
<section class="productos">
  <h2 id="titulo">Productos</h2>
  <div class="productos-grid" id="productos"></div>
</section>

<!-- 🔥 SCRIPT TODO EN UNO (SIN IMPORTS PARA EVITAR ERRORES) -->
<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// 🔴 PON TUS DATOS
const supabase = createClient(
  'https://TU_URL.supabase.co',
  'TU_ANON_KEY'
)

let TODOS = []

// 🛍️ MOSTRAR PRODUCTOS
function mostrarProductos(lista) {
  const cont = document.getElementById('productos')
  cont.innerHTML = ''

  lista.forEach(p => {
    cont.innerHTML += `
      <div class="producto-card">
        <img src="${p.imagen}">
        <h3>${p.nombre}</h3>
        <p class="${p.precio == 0 ? 'agotado' : ''}">
          ${p.precio == 0 ? 'Agotado' : '$' + p.precio}
        </p>
        <button ${p.precio == 0 ? 'disabled' : ''}>
          Comprar
        </button>
      </div>
    `
  })
}

// 🔥 FILTRAR
window.filtrar = function(cat) {
  const filtrados = TODOS.filter(p => p.categoria === cat)
  document.getElementById('titulo').innerText = cat
  mostrarProductos(filtrados)
}

// 🏷️ MOSTRAR CATEGORÍAS
function mostrarCategorias(lista) {
  const cont = document.getElementById('categorias')
  cont.innerHTML = ''

  lista.forEach(c => {
    cont.innerHTML += `
      <div class="categoria-card" onclick="filtrar('${c}')">
        <img src="https://picsum.photos/400/500?random=${c}">
        <h3>${c}</h3>
      </div>
    `
  })
}

// 🚀 INICIO
async function init() {

  // traer productos
  const { data } = await supabase
    .from('productos')
    .select('*')

  TODOS = data

  // sacar categorías únicas
  const categorias = [...new Set(data.map(p => p.categoria))]

  mostrarCategorias(categorias)

  // mostrar primera categoría
  if (categorias.length > 0) {
    filtrar(categorias[0])
  }
}

init()

</script>

</body>
</html>
