<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Tienda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Mi Tienda</h1>
</header>

<section class="admin">
  <h2>Agregar producto</h2>

  <input id="nombre" placeholder="Nombre">
  <input id="precio" placeholder="Precio (0 = agotado)">
  <input id="imagen" placeholder="URL Imagen">
  <input id="categoria" placeholder="Categoría">

  <button onclick="agregarProducto()">Agregar</button>
</section>

<section>
  <h2>Categorías</h2>
  <div id="categorias"></div>
</section>

<section>
  <h2>Productos</h2>
  <div id="productos" class="grid"></div>
</section>

<script type="module" src="script.js"></script>
</body>
</html>
