<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Co'n Estilo</title>
<link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>
</header>

<!-- 🏷️ CATEGORÍAS -->
<section class="categorias">
  <h2>Categorías</h2>
  <div class="categoria-grid" id="categorias"></div>
</section>

<!-- 🔥 DESCUENTOS -->
<section class="productos">
  <h2>🔥 Ofertas</h2>
  <div class="productos-grid" id="descuentos"></div>
</section>

<!-- 🛍️ PRODUCTOS -->
<section class="productos">
  <h2 id="titulo">Productos</h2>
  <div class="productos-grid" id="productos"></div>
</section>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)

let TODOS = []

// 🛍️ RENDER PRODUCTOS
function render(lista, contenedor) {
  const cont = document.getElementById(contenedor)
  cont.innerHTML = ''

  lista.forEach(p => {
    cont.innerHTML += `
      <div class="producto-card">
        <img src="${p.imagen}">
        <h3>${p.nombre}</h3>

        ${
          p.descuento
          ? `<p>
              <span class="precio-viejo">$${p.precio}</span>
              <span class="precio-nuevo">$${p.precio_desc}</span>
            </p>`
          : `<p>$${p.precio}</p>`
        }

        <button onclick="comprar('${p.nombre}')">Comprar</button>
      </div>
    `
  })
}

// 🟢 WHATSAPP
window.comprar = function(nombre) {
  const numero = '5354555815'
  const mensaje = `Hola, quiero comprar: ${nombre}`
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`)
}

// 🔥 FILTRAR
window.filtrar = function(id, nombre) {
  const filtrados = TODOS.filter(p => p.categoria_id == id)
  document.getElementById('titulo').innerText = nombre
  render(filtrados, 'productos')
}

// 🏷️ RENDER CATEGORÍAS
function renderCategorias(lista) {
  const cont = document.getElementById('categorias')
  cont.innerHTML = ''

  lista.forEach(c => {
    cont.innerHTML += `
      <div class="categoria-card" onclick="filtrar(${c.id}, '${c.nombre}')">
        <img src="${c.imagen}">
        <h3>${c.nombre}</h3>
      </div>
    `
  })
}

// 🚀 INIT
async function init() {

  // productos con relación
  const { data: productos } = await supabase
    .from('productos')
    .select('*')

  const { data: categorias } = await supabase
    .from('categorias')
    .select('*')

  TODOS = productos

  const descuentos = productos.filter(p => p.descuento === true)

  renderCategorias(categorias)
  render(descuentos, 'descuentos')

  if (categorias.length > 0) {
    filtrar(categorias[0].id, categorias[0].nombre)
  }
}

init()

</script>

</body>
</html>
