<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co'n Estilo</title>

<link rel="icon" href="https://i.postimg.cc/Gp6QRtKG/IMG-20260520-174004.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>

  <nav>
    <a href="#categorias">Categorías</a>
    <a href="#productos">Descuentos</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="overlay">
    <h1>Moda con estilo</h1>
    <p>Zapatos, ropa y accesorios modernos</p>
    <a href="#productos" class="btn">Ver ofertas 🔥</a>
  </div>
</section>

<!-- CATEGORÍAS -->
<section id="categorias" class="categorias">
  <h2>Categorías</h2>
  <div id="categoriaGrid" class="categoria-grid"></div>
</section>

<!-- DESCUENTOS -->
<section id="productos" class="productos">
  <h2>🔥 Productos en Descuento</h2>
  <div id="descuentosGrid" class="productos-grid"></div>
</section>

<footer id="redes">
  <h3>Co'n Estilo</h3>

  <div class="sociales">
    <a href="#">Facebook</a>
    <a href="#">Instagram</a>
    <a href="#">TikTok</a>
  </div>

  <p class="copy">© 2026 Co'n Estilo</p>
</footer>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// ================= SUPABASE =================
const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)


// ================= WHATSAPP =================
window.comprar = function(nombre, precio) {

  // 🔥 TU NÚMERO DE WHATSAPP (CAMBIA ESTO)
  const telefono = "5354555815"

  const mensaje = `Hola, quiero comprar este producto:%0A
Producto: ${nombre}%0A
Precio: $${precio}`

  const url = `https://wa.me/${telefono}?text=${mensaje}`

  window.open(url, "_blank")
}


// ================= CATEGORÍAS =================
async function cargarCategorias() {

  const { data } = await supabase.from('categorias').select('*')

  const cont = document.getElementById('categoriaGrid')

  cont.innerHTML = ''

  data.forEach(c => {

    cont.innerHTML += `
      <div class="categoria-card">
        <a href="categoria.html?id=${c.id}">
          <img src="${c.imagen}">
          <h3>${c.nombre}</h3>
        </a>
      </div>
    `
  })
}


// ================= DESCUENTOS =================
async function cargarDescuentos() {

  const { data } = await supabase
    .from('productos')
    .select(`
      *,
      descuentos (precio_desc)
    `)

  const cont = document.getElementById('descuentosGrid')

  cont.innerHTML = ''

  data.forEach(p => {

    const tiene = p.descuentos && p.descuentos.length > 0

    if (!tiene) return

    const precioFinal = p.descuentos[0].precio_desc

    cont.innerHTML += `
      <div class="producto-card">
        <img src="${p.imagen}">
        <h3>${p.nombre}</h3>

        <p>
          <span class="precio-viejo">$${p.precio}</span>
          <span class="precio-nuevo">$${precioFinal}</span>
        </p>

        <button onclick="comprar('${p.nombre}','${precioFinal}')">
          Comprar
        </button>
      </div>
    `
  })
}


// ================= INIT =================
cargarCategorias()
cargarDescuentos()

</script>

</body>
</html>
