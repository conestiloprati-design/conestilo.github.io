<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co'n Estilo</title>

<link rel="icon" href="https://i.postimg.cc/Gp6QRtKG/IMG-20260520-174004.png">
<link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
  <div class="logo">Co'n Estilo</div>

  <nav>
    <a href="#productos">Productos</a>
    <a href="#categorias">Categorías</a>
    <a href="#redes">Redes</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="overlay">
    <h1>Moda con estilo</h1>
    <p>Zapatos, ropa y accesorios modernos</p>
    <a href="#productos" class="btn">Ver productos</a>
  </div>
</section>

<!-- CATEGORÍAS (DINÁMICAS) -->
<section id="categorias" class="categorias">
  <h2>Categorías</h2>
  <div class="categoria-grid" id="categoriaGrid"></div>
</section>

<!-- PRODUCTOS EN OFERTA -->
<section id="productos" class="productos">
  <h2>🔥 Productos en Descuento</h2>
  <div class="productos-grid" id="descuentosGrid"></div>
</section>

<!-- FOOTER -->
<footer id="redes">
  <h3>Co'n Estilo</h3>
  <p>Síguenos en nuestras redes sociales</p>

  <div class="sociales">
    <a href="#">Facebook</a>
    <a href="#">Instagram</a>
    <a href="#">TikTok</a>
  </div>

  <p class="copy">© 2026 Co'n Estilo</p>
</footer>

<script src="script.js"></script>

</body>
</html>
