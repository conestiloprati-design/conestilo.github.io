<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin PRO</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background-image: url('https://i.postimg.cc/Qx1fnHFL/IMG-20260506-WA0016.jpg');
  background-size: cover;
}

.panel {
  background: rgba(255,255,255,0.95);
  padding: 15px;
  border-radius: 10px;
}

input, select, button {
  margin: 5px;
  padding: 8px;
}

.producto {
  background: white;
  margin: 10px 0;
  padding: 10px;
}
</style>

</head>

<body>

<div class="panel">

<h2>Admin PRO</h2>

<!-- ================= PRODUCTO ================= -->

<h3>Agregar Producto</h3>

<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<input id="imagen" placeholder="URL imagen">
<input id="moneda" placeholder="USD, CUP">

<select id="categoria"></select>

<select id="tipo">
  <option value="">Tipo</option>
  <option value="talla">Ropa (Talla)</option>
  <option value="numero">Zapato (Número)</option>
</select>

<input id="valor" placeholder="Ej: M o 39">

<button onclick="agregar()">Agregar Producto</button>

<hr>

<!-- ================= CATEGORÍA ================= -->

<h3>Agregar Categoría</h3>

<input id="cat_nombre" placeholder="Nombre categoría">
<input id="cat_imagen" placeholder="URL imagen">

<button onclick="agregarCategoria()">Agregar Categoría</button>

<hr>

<h3>Productos</h3>
<div id="lista"></div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)


// ================= CARGAR CATEGORÍAS =================
async function cargarCategorias() {

  const { data, error } = await supabase.from('categorias').select('*')

  if (error) {
    console.error(error)
    return
  }

  const select = document.getElementById('categoria')
  select.innerHTML = '<option value="">Categoría</option>'

  data.forEach(c => {
    select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`
  })
}


// ================= AGREGAR PRODUCTO =================
window.agregar = async function() {

  if (!nombre.value || !precio.value || !categoria.value || !tipo.value || !valor.value) {
    alert("Faltan datos")
    return
  }

  const { data, error } = await supabase
    .from('productos')
    .insert([{
      nombre: nombre.value,
      precio: parseFloat(precio.value),
      imagen: imagen.value,
      categoria_id: parseInt(categoria.value),
      moneda: moneda.value || "USD",
      estado: "disponible"
    }])
    .select()

  if (error) {
    alert(error.message)
    return
  }

  const productoId = data[0].id

  // guardar talla o número
  if (tipo.value === "talla") {
    await supabase.from('tallas').insert([{
      producto_id: productoId,
      talla: valor.value
    }])
  }

  if (tipo.value === "numero") {
    await supabase.from('numeros').insert([{
      producto_id: productoId,
      numero: valor.value
    }])
  }

  alert("Producto agregado")

  cargar()
}


// ================= AGREGAR CATEGORÍA =================
window.agregarCategoria = async function() {

  if (!cat_nombre.value) {
    alert("Pon nombre a la categoría")
    return
  }

  const { error } = await supabase
    .from('categorias')
    .insert([{
      nombre: cat_nombre.value,
      imagen: cat_imagen.value || null
    }])

  if (error) {
    alert(error.message)
    return
  }

  alert("Categoría agregada")

  cat_nombre.value = ''
  cat_imagen.value = ''

  cargarCategorias()
}


// ================= LISTAR PRODUCTOS =================
async function cargar() {

  const { data } = await supabase
    .from('productos')
    .select(`
      *,
      tallas (talla),
      numeros (numero)
    `)

  const cont = document.getElementById('lista')
  cont.innerHTML = ''

  data.forEach(p => {

    const tallas = p.tallas.map(t => t.talla).join(', ')
    const numeros = p.numeros.map(n => n.numero).join(', ')

    cont.innerHTML += `
      <div class="producto">

        <b>${p.nombre}</b><br>

        ${tallas ? `👕 ${tallas}<br>` : ""}
        ${numeros ? `👟 ${numeros}<br>` : ""}

        💰 ${p.precio} ${p.moneda}

      </div>
    `
  })
}


// ================= INIT =================
cargar()
cargarCategorias()

</script>

</body>
</html>
