<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin PRO</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 10px;

  background-image: url('https://i.postimg.cc/Qx1fnHFL/IMG-20260506-WA0016.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* PANEL */
.panel {
  background: rgba(255,255,255,0.95);
  padding: 15px;
  border-radius: 10px;

  max-width: 900px;
  margin: auto;
}

/* INPUTS */
input, select, button {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  font-size: 16px;
}

/* PRODUCTOS */
.producto {
  background: white;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
}

/* IMAGEN */
.producto img {
  width: 100%;
  max-width: 120px;
  border-radius: 8px;
}

/* BOTONES */
.botones button {
  width: auto;
  margin: 5px 5px 0 0;
  padding: 6px 10px;
}

/* RESPONSIVE EXTRA */
@media (max-width: 600px) {
  h2, h3 {
    font-size: 18px;
  }
}
</style>

</head>

<body>

<div class="panel">

<h2>Admin PRO</h2>

<hr>

<!-- ================= PRODUCTO ================= -->

<h3>Agregar Producto</h3>

<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<input id="imagen" placeholder="URL imagen">
<input id="moneda" placeholder="USD, CUP">

<select id="categoria"></select>

<select id="tipo">
  <option value="">Tipo</option>
  <option value="talla">Ropa (Talla)</option>
  <option value="numero">Zapato (Número)</option>
</select>

<input id="valor" placeholder="Ej: M o 39">

<button onclick="agregar()">Agregar Producto</button>

<hr>

<!-- ================= CATEGORÍA ================= -->

<h3>Agregar Categoría</h3>

<input id="cat_nombre" placeholder="Nombre categoría">
<input id="cat_imagen" placeholder="URL imagen">

<button onclick="agregarCategoria()">Agregar Categoría</button>

<hr>

<h3>Productos</h3>
<div id="lista"></div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)


// ================= CATEGORÍAS =================
async function cargarCategorias() {

  const { data } = await supabase.from('categorias').select('*')

  const select = document.getElementById('categoria')
  select.innerHTML = '<option value="">Categoría</option>'

  data.forEach(c => {
    select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`
  })
}


// ================= AGREGAR PRODUCTO =================
window.agregar = async function() {

  if (!nombre.value || !precio.value || !categoria.value) {
    alert("Faltan datos")
    return
  }

  const { data, error } = await supabase
    .from('productos')
    .insert([{
      nombre: nombre.value,
      precio: parseFloat(precio.value),
      imagen: imagen.value,
      categoria_id: parseInt(categoria.value),
      moneda: moneda.value || "USD"
    }])
    .select()

  if (error) {
    alert(error.message)
    return
  }

  const id = data[0].id

  // talla o número
  if (tipo.value === "talla") {
    await supabase.from('tallas').insert([{
      producto_id: id,
      talla: valor.value
    }])
  }

  if (tipo.value === "numero") {
    await supabase.from('numeros').insert([{
      producto_id: id,
      numero: valor.value
    }])
  }

  // estado por defecto
  await supabase.from('estados').insert([{
    producto_id: id,
    estado: "disponible"
  }])

  alert("Producto agregado")

  cargar()
}


// ================= AGREGAR CATEGORÍA =================
window.agregarCategoria = async function() {

  if (!cat_nombre.value) {
    alert("Pon nombre")
    return
  }

  await supabase.from('categorias').insert([{
    nombre: cat_nombre.value,
    imagen: cat_imagen.value || null
  }])

  cat_nombre.value = ''
  cat_imagen.value = ''

  cargarCategorias()
}


// ================= LISTAR =================
async function cargar() {

  const { data: productos } = await supabase.from('productos').select('*')
  const { data: tallas } = await supabase.from('tallas').select('*')
  const { data: numeros } = await supabase.from('numeros').select('*')
  const { data: estados } = await supabase.from('estados').select('*')
  const { data: descuentos } = await supabase.from('descuentos').select('*')

  const cont = document.getElementById('lista')
  cont.innerHTML = ''

  productos.forEach(p => {

    const t = tallas.filter(x => x.producto_id == p.id).map(x => x.talla)
    const n = numeros.filter(x => x.producto_id == p.id).map(x => x.numero)
    const e = estados.find(x => x.producto_id == p.id)
    const d = descuentos.find(x => x.producto_id == p.id)

    const estado = e ? e.estado : "disponible"

    const estadoTexto = estado === "agotado"
      ? "<span style='color:red'>❌ Agotado</span>"
      : "<span style='color:green'>✔ Disponible</span>"

    cont.innerHTML += `
      <div class="producto">

        <img src="${p.imagen}"><br>

        <b>${p.nombre}</b><br>

        💰 ${p.precio} ${p.moneda}<br>

        ${t.length ? `👕 ${t.join(', ')}<br>` : ""}
        ${n.length ? `👟 ${n.join(', ')}<br>` : ""}

        ${estadoTexto}<br>

        ${d ? `🔥 $${d.precio_desc}<br>` : ""}

        <div class="botones">

          <button onclick="toggleEstado(${p.id}, '${estado}')">
            Cambiar estado
          </button>

          <button onclick="ponerDescuento(${p.id})">💸</button>

          ${d ? `<button onclick="quitarDescuento(${p.id})">❌</button>` : ""}

          <button onclick="eliminar(${p.id})">🗑</button>

        </div>

      </div>
    `
  })
}


// ================= ESTADO =================
window.toggleEstado = async function(id, estado) {

  const nuevo = estado === "agotado" ? "disponible" : "agotado"

  await supabase
    .from('estados')
    .update({ estado: nuevo })
    .eq('producto_id', id)

  cargar()
}


// ================= DESCUENTOS =================
window.ponerDescuento = async function(id) {

  const precio = prompt("Precio con descuento:")
  if (!precio) return

  await supabase.from('descuentos').insert([{
    producto_id: id,
    precio_desc: parseFloat(precio)
  }])

  cargar()
}

window.quitarDescuento = async function(id) {

  await supabase
    .from('descuentos')
    .delete()
    .eq('producto_id', id)

  cargar()
}


// ================= ELIMINAR =================
window.eliminar = async function(id) {

  await supabase.from('productos')
    .delete()
    .eq('id', id)

  cargar()
}


// ================= INIT =================
cargar()
cargarCategorias()

</script>

</body>
</html>
