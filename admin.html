<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin PRO</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background-image: url('https://i.postimg.cc/Qx1fnHFL/IMG-20260506-WA0016.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.panel {
  background: rgba(255,255,255,0.92);
  padding: 15px;
  border-radius: 10px;
}

input, select, button {
  margin: 5px;
  padding: 8px;
}

.producto {
  background: white;
  margin: 10px 0;
  padding: 10px;
  border: 1px solid #ccc;
}
</style>

</head>

<body>

<div class="panel">

<h2>Panel Admin PRO</h2>

<hr>

<!-- ================= PRODUCTO ================= -->

<h3>Agregar Producto</h3>

<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<input id="imagen" placeholder="URL imagen">
<input id="moneda" placeholder="Moneda (USD, CUP)">

<select id="categoria"></select>

<button onclick="agregar()">Agregar Producto</button>

<hr>

<!-- ================= TALLA ================= -->

<h3>Agregar Talla</h3>

<select id="producto_talla"></select>
<input id="talla" placeholder="S, M, L">

<button onclick="agregarTalla()">Agregar Talla</button>

<hr>

<!-- ================= NUMERO ================= -->

<h3>Agregar Número</h3>

<select id="producto_numero"></select>
<input id="numero" placeholder="38, 39, 40">

<button onclick="agregarNumero()">Agregar Número</button>

<hr>

<!-- ================= CATEGORÍA ================= -->

<h3>Agregar Categoría</h3>

<input id="cat_nombre" placeholder="Nombre categoría">
<input id="cat_imagen" placeholder="URL imagen">

<button onclick="agregarCategoria()">Agregar Categoría</button>

<hr>

<h3>Productos</h3>
<div id="lista"></div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)


// ================= CATEGORÍAS =================
async function cargarCategorias() {
  const { data } = await supabase.from('categorias').select('*')

  const select = document.getElementById('categoria')
  select.innerHTML = '<option value="">Selecciona categoría</option>'

  data.forEach(c => {
    select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`
  })
}


// ================= SELECT PRODUCTOS =================
async function cargarSelectProductos() {
  const { data } = await supabase.from('productos').select('*')

  const selTalla = document.getElementById('producto_talla')
  const selNumero = document.getElementById('producto_numero')

  selTalla.innerHTML = ''
  selNumero.innerHTML = ''

  data.forEach(p => {
    selTalla.innerHTML += `<option value="${p.id}">${p.nombre}</option>`
    selNumero.innerHTML += `<option value="${p.id}">${p.nombre}</option>`
  })
}


// ================= AGREGAR PRODUCTO =================
window.agregar = async function() {

  if (!nombre.value || !precio.value || !categoria.value) {
    alert("Faltan datos")
    return
  }

  await supabase.from('productos').insert([{
    nombre: nombre.value,
    precio: parseFloat(precio.value),
    imagen: imagen.value,
    categoria_id: parseInt(categoria.value),
    moneda: moneda.value || "USD",
    estado: "disponible"
  }])

  cargar()
  cargarSelectProductos()
}


// ================= AGREGAR TALLA =================
window.agregarTalla = async function() {

  await supabase.from('tallas').insert([{
    producto_id: parseInt(producto_talla.value),
    talla: talla.value
  }])

  cargar()
}


// ================= AGREGAR NUMERO =================
window.agregarNumero = async function() {

  await supabase.from('numeros').insert([{
    producto_id: parseInt(producto_numero.value),
    numero: numero.value
  }])

  cargar()
}


// ================= AGREGAR CATEGORÍA =================
window.agregarCategoria = async function() {

  await supabase.from('categorias').insert([{
    nombre: cat_nombre.value,
    imagen: cat_imagen.value
  }])

  cargarCategorias()
}


// ================= LISTAR PRODUCTOS =================
async function cargar() {

  const { data } = await supabase
    .from('productos')
    .select(`
      *,
      descuentos (precio_desc),
      tallas (talla),
      numeros (numero)
    `)

  const cont = document.getElementById('lista')
  cont.innerHTML = ''

  data.forEach(p => {

    const tieneDesc = p.descuentos && p.descuentos.length > 0
    const precioFinal = tieneDesc ? p.descuentos[0].precio_desc : p.precio

    const tallas = p.tallas.map(t => t.talla).join(', ')
    const numeros = p.numeros.map(n => n.numero).join(', ')

    cont.innerHTML += `
      <div class="producto">

        <b>${p.nombre}</b><br>

        ${tallas ? `👕 Tallas: ${tallas}<br>` : ""}
        ${numeros ? `👟 Números: ${numeros}<br>` : ""}

        💰 ${p.precio} ${p.moneda || "USD"}<br>

        ${p.estado === "agotado"
          ? "<span style='color:red'>❌ AGOTADO</span>"
          : "<span style='color:green'>✔ DISPONIBLE</span>"
        }

        <br>

        ${
          tieneDesc
          ? `<s>$${p.precio}</s> → <b>$${precioFinal}</b>`
          : `$${p.precio}`
        }

        <br>

        <button onclick="toggleEstado(${p.id}, '${p.estado}')">
          Cambiar estado
        </button>

        ${
          tieneDesc
          ? `<button onclick="quitarDescuento(${p.id})">❌ Quitar descuento</button>`
          : `<button onclick="ponerDescuento(${p.id})">💸 Poner descuento</button>`
        }

        <button onclick="eliminar(${p.id})">🗑 Eliminar</button>

      </div>
    `
  })
}


// ================= ESTADO =================
window.toggleEstado = async function(id, estado) {

  const nuevo = estado === "agotado" ? "disponible" : "agotado"

  await supabase
    .from('productos')
    .update({ estado: nuevo })
    .eq('id', id)

  cargar()
}


// ================= DESCUENTOS =================
window.ponerDescuento = async function(id) {

  const precio_desc = prompt("Precio con descuento:")

  await supabase.from('descuentos').insert([{
    producto_id: id,
    precio_desc: parseFloat(precio_desc)
  }])

  cargar()
}

window.quitarDescuento = async function(id) {

  await supabase
    .from('descuentos')
    .delete()
    .eq('producto_id', id)

  cargar()
}


// ================= ELIMINAR =================
window.eliminar = async function(id) {

  await supabase
    .from('productos')
    .delete()
    .eq('id', id)

  cargar()
}


// ================= INIT =================
cargar()
cargarCategorias()
cargarSelectProductos()

</script>

</body>
</html>
