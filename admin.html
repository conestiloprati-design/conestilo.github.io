<!DOCTYPE html>
<html>
<head>
<title>Admin PRO</title>
</head>

<body>

<h2>➕ Categoría</h2>
<input id="cat">
<button onclick="addCat()">Agregar</button>

<h2>🛍️ Producto</h2>
<input id="nombre" placeholder="Nombre">
<input id="precio" placeholder="Precio">
<input id="imagen" placeholder="URL imagen">

<select id="categoria"></select>

<label><input type="checkbox" id="desc"> Descuento</label>
<label><input type="checkbox" id="stock" checked> Disponible</label>

<button onclick="addProd()">Guardar</button>

<h2>📦 Lista</h2>
<div id="lista"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = window.supabase.createClient("https://fypjfxwcruzmbrvoijwg.supabase.co","fypjfxwcruzmbrvoijwg");

async function loadCat() {
  const { data } = await supabase.from("categorias").select("*");
  categoria.innerHTML="";
  data.forEach(c=>{
    categoria.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
  });
}

async function addCat(){
  await supabase.from("categorias").insert([{nombre:cat.value}]);
  loadCat();
}

async function addProd(){
  await supabase.from("productos").insert([{
    nombre:nombre.value,
    precio:precio.value,
    imagen:imagen.value,
    categoria_id:categoria.value,
    en_descuento:desc.checked,
    stock:stock.checked
  }]);
  loadProd();
}

async function loadProd(){
  const { data } = await supabase.from("productos").select("*");
  lista.innerHTML="";
  data.forEach(p=>{
    lista.innerHTML += `
      <div>
        ${p.nombre}
        <button onclick="del('${p.id}')">❌</button>
      </div>
    `;
  });
}

async function del(id){
  await supabase.from("productos").delete().eq("id",id);
  loadProd();
}

loadCat();
loadProd();
</script>

</body>
</html>
