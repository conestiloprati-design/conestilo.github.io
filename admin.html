<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
  
<link rel="icon" href="https://i.postimg.cc/Gp6QRtKG/IMG-20260520-174004.png">
<link rel="manifest" href="admin-manifest.json">
<meta name="theme-color" content="#2196f3">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  min-height: 100vh;

  background-image: url('https://i.postimg.cc/Qx1fnHFL/IMG-20260506-WA0016.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* 🔮 PANEL GLASS MODERNO */
.panel {
  max-width: 1100px;
  margin: auto;

  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(10px);

  padding: 20px;
  border-radius: 15px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* inputs más modernos */
input, select, textarea, button {
  margin: 5px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  outline: none;
}

button {
  cursor: pointer;
  background: #2196f3;
  color: white;
  border: none;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.03);
  background: #1976d2;
}

/* 📦 LISTA PRODUCTOS */
#lista {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 15px;
  margin-top: 10px;
}

/* 🧾 CARD PRODUCTO */
.producto {
  background: white;
  border-radius: 12px;
  padding: 12px;

  display: flex;
  gap: 10px;
  align-items: flex-start;

  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.2s;
}

.producto:hover {
  transform: translateY(-3px);
}

.producto img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 10px;
}

/* categorías */
#lista-categorias {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

  .btn-historial {
  margin-top: 5px;
  background: #4caf50;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
}

.btn-historial:hover {
  background: #3e8e41;
}
  
</style>
</head>

<body>

<div class="panel">

  <div class="admin-header">
    <h2>Admin Con'Estilo</h2>

    <div class="visitas-box">
  👀 hoy: <span id="visitasHoy">0</span>
  </div>

  <hr>

<div id="historial" style="display:none; margin-top:10px;"></div>  
    
<h3>Agregar Producto</h3>

<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<input id="imagen" placeholder="URL imagen">
<input id="moneda" placeholder="USD, CUP">
<textarea id="descripcion" placeholder="Descripción" rows="4"></textarea>
<select id="categoria"></select>

<input id="talla" placeholder="Talla (opcional)">
<input id="numero" placeholder="Número (opcional)">

<button onclick="agregar()">Agregar Producto</button>

<hr>

<h3>Agregar Categoría</h3>

<input id="cat_nombre" placeholder="Nombre categoría">
<input id="cat_imagen" placeholder="URL imagen">

<button onclick="agregarCategoria()">Agregar Categoría</button>

<hr>

<h3>Productos</h3>
<div id="lista"></div>
<h3>Categorías</h3>
<div id="lista-categorias"></div>
</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)

// ================= CATEGORÍAS =================
async function cargarCategorias() {

  const { data, error } = await supabase.from('categorias').select('*')

  if (error) {
    console.log(error)
    return
  }

  categoria.innerHTML = '<option value="">Categoría</option>'

  data.forEach(c => {
    categoria.innerHTML += `<option value="${c.id}">${c.nombre}</option>`
  })
}

// ================= LISTAR CATEGORÍAS =================
async function cargarListaCategorias() {
  const { data: categorias, error } = await supabase.from('categorias').select('*')

  if (error) {
    console.error(error)
    return
  }

  const contenedor = document.getElementById("lista-categorias")
  contenedor.innerHTML = ""

  categorias.forEach(c => {
    contenedor.innerHTML += `
      <div class="producto">
        ${c.imagen ? `<img src="${c.imagen}" alt="${c.nombre}">` : ""}
        <div>
          <b>${c.nombre}</b><br>
          <button onclick="editarCategoria(${c.id}, '${c.nombre}','${c.imagen || ""}')">✏️ Editar</button>
          <button onclick="eliminarCategoria(${c.id})">🗑 Eliminar</button>
        </div>
      </div>
    `
  })
}

// ================= EDITAR CATEGORÍA =================
window.editarCategoria = async function(id, nombreActual, imagenActual) {

  const nuevoNombre = prompt(
    "Nuevo nombre de la categoría:",
    nombreActual
  )

  if (nuevoNombre === null) return

  const nuevaImagen = prompt(
    "Nueva URL de la imagen:",
    imagenActual || ""
  )

  if (nuevaImagen === null) return

  const { error } = await supabase
    .from('categorias')
    .update({
      nombre: nuevoNombre,
      imagen: nuevaImagen
    })
    .eq('id', id)

  if (error) {
    alert("Error al editar: " + error.message)
    return
  }

  alert("Categoría actualizada")
  cargarListaCategorias()
}

// ================= ELIMINAR CATEGORÍA =================
window.eliminarCategoria = async function(id) {
  const confirmar = confirm("¿Seguro que deseas eliminar esta categoría?")
  if (!confirmar) return

  const { error } = await supabase
    .from('categorias')
    .delete()
    .eq('id', id)

  if (error) {
    alert("Error al eliminar: " + error.message)
    return
  }

  alert("Categoría eliminada")
  cargarListaCategorias()
}
 
// ================= AGREGAR PRODUCTO =================
window.agregar = async function() {

  if (!nombre.value || !precio.value || !categoria.value) {
    alert("Faltan datos")
    return
  }

  const { data, error } = await supabase
    .from('productos')
    .insert([{
      nombre: nombre.value,
      precio: parseFloat(precio.value),
      imagen: imagen.value,
      categoria_id: parseInt(categoria.value),
      moneda: moneda.value || "USD",
      talla: talla.value || null,
      numero: numero.value || null,
      descripcion: descripcion.value || null
    }])
    .select()

  if (error) {
    alert(error.message)
    return
  }

  // Crear estado automático
  const { error: errorEstado } = await supabase.from('estados').insert([{
    producto_id: data[0].id,
    estado: "disponible"
  }])

  if (errorEstado) console.log(errorEstado)

  alert("Producto agregado")

  cargar()
}

// ================= AGREGAR CATEGORÍA =================
window.agregarCategoria = async function() {

  if (!cat_nombre.value) {
    alert("Pon nombre a la categoría")
    return
  }

  const { error } = await supabase
    .from('categorias')
    .insert([{
      nombre: cat_nombre.value,
      imagen: cat_imagen.value || null
    }])

  if (error) {
    alert(error.message)
    return
  }

  alert("Categoría agregada")

  cat_nombre.value = ''
  cat_imagen.value = ''

  cargarCategorias()
}

// ================= ESTADO (FUNCIONAL) =================
window.toggleEstado = async function(id, actual) {
  // Alternar entre disponible y agotado
  const nuevo = actual === "agotado" ? "disponible" : "agotado";

  // Buscar si ya existe un estado para este producto
  const { data, error } = await supabase
    .from('estados')
    .select('*')
    .eq('producto_id', id);

  if (error) {
    alert("Error al buscar estado");
    console.log(error);
    return;
  }

  if (data && data.length > 0) {
    // Si existe, actualizar el primero
    const { error: errorUpdate } = await supabase
      .from('estados')
      .update({ estado: nuevo })
      .eq('producto_id', id);

    if (errorUpdate) {
      alert("Error al actualizar");
      console.log(errorUpdate);
      return;
    }
  } else {
    // Si no existe, crear uno nuevo
    const { error: errorInsert } = await supabase
      .from('estados')
      .insert([{ producto_id: id, estado: nuevo }]);

    if (errorInsert) {
      alert("Error al crear estado");
      console.log(errorInsert);
      return;
    }
  }

  // Recargar lista para ver el cambio
  cargar();
}

// ================= DESCUENTOS =================
window.ponerDescuento = async function(id) {

  const precio = prompt("Precio descuento")
  if (!precio) return

  await supabase.from('descuentos').insert([{
    producto_id: id,
    precio_desc: parseFloat(precio)
  }])

  cargar()
}

window.quitarDescuento = async function(id) {

  await supabase.from('descuentos')
    .delete()
    .eq('producto_id', id)

  cargar()
}

// ================= ELIMINAR PRODUCTO =================
window.eliminar = async function(idProducto) {

  const confirmar = confirm("¿Seguro que deseas eliminar este producto?")

  if (!confirmar) return

  try {

    // Eliminar estados relacionados
    const { error: errorEstado } = await supabase
      .from('estados')
      .delete()
      .eq('producto_id', idProducto)

    if (errorEstado) throw errorEstado

    // Eliminar descuentos relacionados
    const { error: errorDescuento } = await supabase
      .from('descuentos')
      .delete()
      .eq('producto_id', idProducto)

    if (errorDescuento) throw errorDescuento

    // Eliminar producto
    const { error: errorProducto } = await supabase
      .from('productos')
      .delete()
      .eq('id', idProducto)

    if (errorProducto) throw errorProducto

    alert("Producto eliminado correctamente")

    cargar()

  } catch (error) {

    console.error(error)

    alert("Error al eliminar: " + error.message)

  }
}
  
// ================= Editar Descripcion =================
window.editar = async function(id) {

    // Obtener la información del producto
    console.log("ID del producto a editar:", id);

    const { data: producto, error: fetchError } = await supabase
        .from('productos')
        .select('*')
        .eq('id', id)
        .single();

    // Manejo de errores al obtener el producto
    if (fetchError) {
        alert("Error al obtener el producto para editar: " + fetchError.message);
        console.error(fetchError);
        return;
    }

    if (!producto) {
        alert("Producto no encontrado");
        return;
    }

    console.log("Producto obtenido:", producto);

    // Crear ventana de edición
    const fondo = document.createElement("div");
    fondo.style.position = "fixed";
    fondo.style.top = "0";
    fondo.style.left = "0";
    fondo.style.width = "100%";
    fondo.style.height = "100%";
    fondo.style.background = "rgba(0,0,0,0.5)";
    fondo.style.display = "flex";
    fondo.style.justifyContent = "center";
    fondo.style.alignItems = "center";
    fondo.style.zIndex = "9999";

    fondo.innerHTML = `
        <div style="
            background:white;
            padding:20px;
            border-radius:10px;
            width:90%;
            max-width:500px;
        ">
            <h3>Editar descripción</h3>

            <textarea
                id="nuevaDescripcion"
                style="width:100%;height:200px;padding:10px;"
            >${producto.descripcion || ""}</textarea>

            <br><br>

            <button id="guardarDescripcion">Guardar</button>
            <button id="cancelarDescripcion">Cancelar</button>
        </div>
    `;

    document.body.appendChild(fondo);

    document.getElementById("cancelarDescripcion").onclick = () => {
        document.body.removeChild(fondo);
    };

    document.getElementById("guardarDescripcion").onclick = async () => {

        const nuevaDescripcion =
            document.getElementById("nuevaDescripcion").value;

        console.log(
            "Nueva descripción introducida:",
            nuevaDescripcion
        );

        // Actualizar la descripción en la base de datos
        const { error: updateError } = await supabase
            .from('productos')
            .update({
                descripcion: nuevaDescripcion
            })
            .eq('id', id);

        // Manejo de errores al actualizar
        if (updateError) {
            alert(
                "Error al actualizar la descripción: " +
                updateError.message
            );
            console.error(
                "Error al actualizar:",
                updateError
            );
            return;
        }

        document.body.removeChild(fondo);

        alert("Descripción actualizada correctamente.");
        cargar();
    };
}
// ================= LISTAR =================
async function cargar() {
  const { data: productos } = await supabase.from('productos').select('*')
  const { data: estados } = await supabase.from('estados').select('*')
  const { data: descuentos } = await supabase.from('descuentos').select('*')

  lista.innerHTML = ''

  // función de prioridad
  function prioridad(p) {
    const e = estados.find(x => Number(x.producto_id) === Number(p.id));
    const d = descuentos.find(x => Number(x.producto_id) === Number(p.id));
    if (d) return 1; // primero descuento
    if (e && e.estado === "agotado") return 2; // luego agotados
    return 3; // al final disponibles
  }

  const ordenados = [...productos].sort((a, b) => prioridad(a) - prioridad(b));

  ordenados.forEach(p => {
    const e = estados.find(x => Number(x.producto_id) === Number(p.id))
    const estado = e ? e.estado : "disponible"
    const d = descuentos.find(x => Number(x.producto_id) === Number(p.id))

    const estadoColor = estado === "agotado"
      ? "<span style='color:red'>❌ AGOTADO</span>"
      : "<span style='color:green'>✔ DISPONIBLE</span>"

    lista.innerHTML += `
      <div class="producto">
        <img src="${p.imagen || ''}">
        <div>
          <b>${p.nombre}</b><br>
          💰 ${p.precio} ${p.moneda}<br>
          ${p.talla ? `👕 ${p.talla}<br>` : ""}
          ${p.numero ? `👟 ${p.numero}<br>` : ""}
          ${p.descripcion ? `📝 ${p.descripcion}<br>` : ""}
          ${estadoColor}<br>
          ${d ? `🔥 $${d.precio_desc}<br>` : ""}
          <button onclick="toggleEstado(${p.id}, '${estado}')">Cambiar estado</button>
          <button onclick="ponerDescuento(${p.id})">💸</button>
          ${d ? `<button onclick="quitarDescuento(${p.id})">❌</button>` : ""}
          <button onclick="editar(${p.id})">✏️</button>
          <button onclick="eliminar(${p.id})">🗑</button>
        </div>
      </div>
    `
  })
}

// ================= INIT =================
cargar()
cargarCategorias()
cargarListaCategorias() 

async function cargarVisitasHoy() {

  const hoy = new Date().toISOString().split("T")[0];

  const { data, error } = await supabase
    .from("visitas")
    .select("created_at");

  if (error) {
    console.log(error);
    return;
  }

  const total = data.filter(v =>
    v.created_at.split("T")[0] === hoy
  ).length;

  document.getElementById("visitasHoy").innerText = total;
}

cargarVisitasHoy(); 

window.toggleHistorial = async function () {

  const div = document.getElementById("historial");

  if (div.style.display === "none") {
    div.style.display = "block";
    await cargarHistorial();
  } else {
    div.style.display = "none";
  }
};

// ================= HISTORIAL DE VISITAS =================
async function cargarHistorial() {

  const { data, error } = await supabase
    .from("visitas")
    .select("created_at");

  if (error) {
    console.log(error);
    return;
  }

  const resumen = {};

  data.forEach(v => {
    const dia = v.created_at.split("T")[0];

    if (!resumen[dia]) {
      resumen[dia] = 0;
    }

    resumen[dia]++;
  });

  let html = "";

  Object.keys(resumen)
    .sort()
    .reverse()
    .forEach(dia => {
      html += `<p>📅 ${dia} → 👀 ${resumen[dia]} visitas</p>`;
    });

  document.getElementById("historial").innerHTML = html;
}

cargarHistorial();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./admin-sw.js');
}
</script>

</body>
</html>
