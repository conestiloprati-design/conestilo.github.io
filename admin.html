<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background-image: url('https://i.postimg.cc/Qx1fnHFL/IMG-20260506-WA0016.jpg');
  background-size: cover;
}

.panel {
  background: rgba(255,255,255,0.95);
  padding: 15px;
  border-radius: 10px;
}

input, select, button {
  margin: 5px;
  padding: 8px;
}

.producto {
  background: white;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  display: flex;
  gap: 10px;
}

.producto img {
  width: 70px;
  height: 70px;
  object-fit: cover;
}
</style>
</head>

<body>

<div class="panel">

<h2>Admin</h2>

<hr>

<!-- PRODUCTO -->
<h3>Agregar Producto</h3>

<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<input id="imagen" placeholder="URL imagen">
<input id="moneda" placeholder="USD, CUP">

<select id="categoria"></select>

<input id="talla" placeholder="Talla (opcional)">
<input id="numero" placeholder="Número (opcional)">

<button onclick="agregar()">Agregar Producto</button>

<hr>

<!-- CATEGORÍA -->
<h3>Agregar Categoría</h3>

<input id="cat_nombre" placeholder="Nombre categoría">
<input id="cat_imagen" placeholder="URL imagen">

<button onclick="agregarCategoria()">Agregar Categoría</button>

<hr>

<h3>Productos</h3>
<div id="lista"></div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'sb_publishable_n_uQGLyDg5sgMgBRBvYdng_IqpQeX1L'
)


// ================= CATEGORÍAS =================
async function cargarCategorias() {

  const { data } = await supabase.from('categorias').select('*')

  categoria.innerHTML = '<option value="">Categoría</option>'

  data.forEach(c => {
    categoria.innerHTML += `<option value="${c.id}">${c.nombre}</option>`
  })
}


// ================= AGREGAR PRODUCTO =================
window.agregar = async function() {

  if (!nombre.value || !precio.value || !categoria.value) {
    alert("Faltan datos")
    return
  }

  const { data, error } = await supabase
    .from('productos')
    .insert([{
      nombre: nombre.value,
      precio: parseFloat(precio.value),
      imagen: imagen.value,
      categoria_id: parseInt(categoria.value),
      moneda: moneda.value || "USD",
      talla: talla.value || null,
      numero: numero.value || null
    }])
    .select()

  if (error) {
    alert(error.message)
    return
  }

  // crear estado automático
  await supabase.from('estados').insert([{
    producto_id: data[0].id,
    estado: "disponible"
  }])

  alert("Producto agregado")

  cargar()
}


// ================= AGREGAR CATEGORÍA =================
window.agregarCategoria = async function() {

  if (!cat_nombre.value) {
    alert("Pon nombre a la categoría")
    return
  }

  const { error } = await supabase
    .from('categorias')
    .insert([{
      nombre: cat_nombre.value,
      imagen: cat_imagen.value || null
    }])

  if (error) {
    alert(error.message)
    return
  }

  alert("Categoría agregada")

  cat_nombre.value = ''
  cat_imagen.value = ''

  cargarCategorias()
}


// ================= CAMBIAR ESTADO (FIX REAL) =================
window.toggleEstado = async function(id, actual) {

  const nuevo = actual === "agotado" ? "disponible" : "agotado"

  // 🔥 verificar si existe
  const { data } = await supabase
    .from('estados')
    .select('*')
    .eq('producto_id', id)

  if (data.length > 0) {
    await supabase
      .from('estados')
      .update({ estado: nuevo })
      .eq('producto_id', id)
  } else {
    await supabase
      .from('estados')
      .insert([{ producto_id: id, estado: nuevo }])
  }

  cargar()
}


// ================= DESCUENTOS =================
window.ponerDescuento = async function(id) {

  const precio = prompt("Precio descuento")
  if (!precio) return

  await supabase.from('descuentos').insert([{
    producto_id: id,
    precio_desc: parseFloat(precio)
  }])

  cargar()
}

window.quitarDescuento = async function(id) {

  await supabase.from('descuentos')
    .delete()
    .eq('producto_id', id)

  cargar()
}


// ================= ELIMINAR =================
window.eliminar = async function(id) {

  await supabase.from('productos').delete().eq('id', id)
  await supabase.from('estados').delete().eq('producto_id', id)
  await supabase.from('descuentos').delete().eq('producto_id', id)

  cargar()
}


// ================= LISTAR =================
async function cargar() {

  const { data: productos } = await supabase.from('productos').select('*')
  const { data: estados } = await supabase.from('estados').select('*')
  const { data: descuentos } = await supabase.from('descuentos').select('*')

  lista.innerHTML = ''

  productos.forEach(p => {

    const e = estados.find(x => x.producto_id == p.id)
    const estado = e ? e.estado : "disponible"

    const d = descuentos.find(x => x.producto_id == p.id)

    const estadoColor = estado === "agotado"
      ? "<span style='color:red'>❌ AGOTADO</span>"
      : "<span style='color:green'>✔ DISPONIBLE</span>"

    lista.innerHTML += `
      <div class="producto">

        <img src="${p.imagen || ''}">

        <div>

          <b>${p.nombre}</b><br>

          💰 ${p.precio} ${p.moneda}<br>

          ${p.talla ? `👕 ${p.talla}<br>` : ""}
          ${p.numero ? `👟 ${p.numero}<br>` : ""}

          ${estadoColor}<br>

          ${d ? `🔥 $${d.precio_desc}<br>` : ""}

          <button onclick="toggleEstado(${p.id}, '${estado}')">
            Cambiar estado
          </button>

          <button onclick="ponerDescuento(${p.id})">💸</button>

          ${d ? `<button onclick="quitarDescuento(${p.id})">❌</button>` : ""}

          <button onclick="eliminar(${p.id})">🗑</button>

        </div>

      </div>
    `
  })
}


// ================= INIT =================
cargar()
cargarCategorias()

</script>

</body>
</html>
