<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin PRO</title>

<style>
body { font-family: Arial; padding: 20px; }
input, select, button { margin: 5px; padding: 8px; }
.producto { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
</style>

</head>

<body>

<h2>Panel Admin</h2>

<!-- ================= PRODUCTOS ================= -->

<h3>Agregar Producto</h3>

<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<input id="imagen" placeholder="URL imagen">

<select id="categoria"></select>

<button onclick="agregar()">Agregar Producto</button>

<hr>

<!-- ================= CATEGORÍAS ================= -->

<h3>Agregar Categoría</h3>

<input id="cat_nombre" placeholder="Nombre categoría">
<input id="cat_imagen" placeholder="URL imagen">

<button onclick="agregarCategoria()">Agregar Categoría</button>

<hr>

<!-- ================= LISTA ================= -->

<h3>Productos</h3>
<div id="lista"></div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fypjfxwcruzmbrvoijwg.supabase.co',
  'TU_PUBLIC_KEY_AQUI'
)


// ================= CARGAR CATEGORÍAS =================

async function cargarCategorias() {
  const { data, error } = await supabase.from('categorias').select('*')

  if (error) {
    console.error(error)
    return
  }

  const select = document.getElementById('categoria')
  select.innerHTML = '<option value="">Selecciona categoría</option>'

  data.forEach(c => {
    select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`
  })
}


// ================= AGREGAR PRODUCTO =================

window.agregar = async function() {

  if (!nombre.value || !precio.value || !categoria.value) {
    alert("Faltan datos")
    return
  }

  const { error } = await supabase.from('productos').insert([{
    nombre: nombre.value,
    precio: parseFloat(precio.value),
    imagen: imagen.value,
    categoria_id: parseInt(categoria.value)
  }])

  if (error) {
    console.error(error)
    alert("Error: " + error.message)
    return
  }

  alert("Producto agregado")

  nombre.value = ''
  precio.value = ''
  imagen.value = ''

  cargar()
}


// ================= AGREGAR CATEGORÍA =================

window.agregarCategoria = async function() {

  if (!cat_nombre.value) {
    alert("Pon nombre a la categoría")
    return
  }

  const { error } = await supabase
    .from('categorias')
    .insert([{
      nombre: cat_nombre.value,
      imagen: cat_imagen.value || null
    }])

  if (error) {
    console.error(error)
    alert("Error: " + error.message)
    return
  }

  alert("Categoría agregada")

  cat_nombre.value = ''
  cat_imagen.value = ''

  cargarCategorias()
}


// ================= CARGAR PRODUCTOS + DESCUENTOS =================

async function cargar() {

  const { data, error } = await supabase
    .from('productos')
    .select(`
      *,
      descuentos (precio_desc)
    `)

  if (error) {
    console.error(error)
    return
  }

  const cont = document.getElementById('lista')
  cont.innerHTML = ''

  data.forEach(p => {

    const tieneDesc = p.descuentos.length > 0
    const precioFinal = tieneDesc ? p.descuentos[0].precio_desc : p.precio

    cont.innerHTML += `
      <div class="producto">
        <b>${p.nombre}</b><br>

        ${
          tieneDesc
          ? `<s>$${p.precio}</s> → <b>$${precioFinal}</b>`
          : `$${p.precio}`
        }

        <br>

        ${
          tieneDesc
          ? `<button onclick="quitarDescuento(${p.id})">❌ Quitar descuento</button>`
          : `<button onclick="ponerDescuento(${p.id})">💸 Poner descuento</button>`
        }

        <button onclick="eliminar(${p.id})">🗑 Eliminar</button>
      </div>
    `
  })
}


// ================= PONER DESCUENTO =================

window.ponerDescuento = async function(id) {

  const precio_desc = prompt("Precio con descuento:")

  if (!precio_desc) return

  const { error } = await supabase
    .from('descuentos')
    .insert([{
      producto_id: id,
      precio_desc: parseFloat(precio_desc)
    }])

  if (error) {
    console.error(error)
    alert("Error: " + error.message)
    return
  }

  cargar()
}


// ================= QUITAR DESCUENTO =================

window.quitarDescuento = async function(id) {

  const { error } = await supabase
    .from('descuentos')
    .delete()
    .eq('producto_id', id)

  if (error) {
    console.error(error)
    return
  }

  cargar()
}


// ================= ELIMINAR PRODUCTO =================

window.eliminar = async function(id) {

  const { error } = await supabase
    .from('productos')
    .delete()
    .eq('id', id)

  if (error) {
    console.error(error)
    return
  }

  cargar()
}


// ================= INIT =================

cargar()
cargarCategorias()

</script>

</body>
</html>
